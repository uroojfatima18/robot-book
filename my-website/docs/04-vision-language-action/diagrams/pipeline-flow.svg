<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .arrow { fill: none; stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .title { font-size: 16px; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="text title" fill="#333">Robotic Pipeline Flow</text>

  <!-- Boxes -->
  <rect x="50" y="70" width="120" height="60" class="box" rx="5"/>
  <text x="110" y="105" class="text" fill="#333">Sensor Input</text>

  <rect x="250" y="70" width="120" height="60" class="box" rx="5"/>
  <text x="310" y="105" class="text" fill="#333">Processing</text>

  <rect x="450" y="70" width="120" height="60" class="box" rx="5"/>
  <text x="510" y="105" class="text" fill="#333">Decision</text>

  <rect x="650" y="70" width="120" height="60" class="box" rx="5"/>
  <text x="710" y="105" class="text" fill="#333">Actuation</text>

  <!-- Arrows -->
  <line x1="170" y1="100" x2="250" y2="100" class="arrow"/>
  <text x="210" y="95" class="text" fill="#666">Data</text>

  <line x1="370" y1="100" x2="450" y2="100" class="arrow"/>
  <text x="410" y="95" class="text" fill="#666">Results</text>

  <line x1="570" y1="100" x2="650" y2="100" class="arrow"/>
  <text x="610" y="95" class="text" fill="#666">Commands</text>

  <!-- Feedback arrow -->
  <path d="M 710 140 Q 400 180 110 140" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="400" y="170" class="text" fill="#666">Feedback Loop</text>
</svg>